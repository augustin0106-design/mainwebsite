<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>駿佾老師的Gogoland</title>
  <meta name="description" content="駿佾老師的互動教學模擬入口網站">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20260518">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="assets/js/analytics-config.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/site.js?v=20260518" defer></script>
</head>
<body>
  <div class="app-shell" data-sidebar-open="true">
    <header class="topbar">
      <button class="icon-button" id="sidebar-toggle" type="button" aria-label="切換側邊欄">
        <i data-lucide="panel-left"></i>
      </button>
      <a class="brand" href="./" aria-label="回到首頁">
        <span class="brand-mark">Go</span>
        <span>
          <strong>駿佾老師的Gogoland</strong>
          <small>互動教學模擬庫</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="ghost-button" id="home-button" type="button">
          <i data-lucide="sparkles"></i>
          首頁
        </button>
        <a class="ghost-button" href="admin/" target="_blank" rel="noopener">
          <i data-lucide="settings"></i>
          後台
        </a>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="模擬程式選單">
      <div class="sidebar-head">
        <label class="search-box">
          <i data-lucide="search"></i>
          <input id="search-input" type="search" placeholder="搜尋模擬、主題或關鍵字">
        </label>
      </div>
      <nav id="category-list" class="category-list"></nav>
    </aside>

    <main class="workspace">
      <section class="welcome-panel" id="welcome-panel">
        <div class="welcome-copy">
          <p class="eyebrow">Learning by playing, thinking by doing</p>
          <h1>把抽象概念變成可以操作的學習冒險</h1>
          <p>選擇左側類別與模擬程式，主畫面會直接載入互動 HTML。適合教師課堂展示，也適合學生自己探索。</p>
          <div class="quick-stats" id="quick-stats"></div>
        </div>
        <div class="featured-list" id="featured-list" aria-label="推薦模擬"></div>
      </section>

      <section class="player-panel" id="player-panel" hidden>
        <div class="player-toolbar">
          <div class="player-title">
            <span id="current-category"></span>
            <h2 id="current-title"></h2>
          </div>
          <div class="player-actions">
            <button class="icon-button" id="reload-button" type="button" aria-label="重新載入">
              <i data-lucide="refresh-cw"></i>
            </button>
            <a class="icon-button" id="open-new-button" target="_blank" rel="noopener" aria-label="在新分頁開啟">
              <i data-lucide="external-link"></i>
            </a>
          </div>
        </div>
        <div class="frame-wrap">
          <div class="frame-loading" id="frame-loading">
            <i data-lucide="loader-circle"></i>
            載入模擬中...
          </div>
          <iframe id="simulation-frame" title="教學模擬" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
